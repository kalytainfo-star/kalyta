# Temporaneo: legge le domande del modulo iscrizioni e i loro codici (entry.*)
name: Leggi modulo iscrizioni
on:
  push:
    branches: [claude/youthful-brown-e8vly9]
    paths: [.github/workflows/leggi-modulo.yml]
jobs:
  leggi:
    runs-on: ubuntu-latest
    steps:
      - name: Codici delle domande
        run: |
          for ID in 1Vlwm3kS5A5A689rNjITp8JAf1KR5vJZiznfbhhgTxC4 1RU82rvmb822AqMCr6e9TLyqI6sk-kaQzAkjnLn9HcWo; do
          echo "=== $ID"
          curl -sSL "https://docs.google.com/forms/d/$ID/viewform" -o f.html -w "HTTP %{http_code} %{url_effective}\n"
          python3 - <<'P' || true
          import re, json
          h = open("f.html", encoding="utf-8").read()
          m = re.search(r"FB_PUBLIC_LOAD_DATA_ = (.*?);\s*</script>", h, re.S)
          if not m:
              print("Modulo non leggibile (non pubblicato o non accetta risposte)")
              raise SystemExit
          d = json.loads(m.group(1))
          print("Titolo:", d[1][8] if len(d[1]) > 8 else d[3])
          for q in d[1][1]:
              if q[4]:
                  for f in q[4]:
                      print("DOMANDA:", q[1], "| tipo:", q[3], "| entry." + str(f[0]), "| opzioni:", [o[0] for o in (f[1] or [])][:20])
          P
          done
